<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b16">
  <title>كراستي | جاري التطوير</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 20%, rgba(124,58,237,.18), transparent 35%),
        #070b16;
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
    }
    .card {
      width: min(520px, 100%);
      text-align: center;
      padding: 42px 28px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 28px;
      background: rgba(15,23,42,.82);
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 22px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 900;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      box-shadow: 0 12px 35px rgba(124,58,237,.3);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 7vw, 42px);
    }
    p {
      margin: 0;
      color: #aab4c8;
      font-size: 17px;
      line-height: 1.9;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 26px;
      padding: 11px 18px;
      border-radius: 999px;
      background: rgba(34,197,94,.10);
      border: 1px solid rgba(34,197,94,.22);
      color: #86efac;
      font-size: 14px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
    }
    .footer {
      margin-top: 28px;
      color: #667085;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">ك</div>
    <h1>كراستي</h1>
    <p>🚧 الموقع قيد التطوير حالياً</p>
    <p>نعمل على تجهيز التطبيق وتحسينه ليكون جاهزاً لكم قريباً.</p>

    <div class="status">
      <span class="dot"></span>
      جاري التطوير والتجهيز
    </div>

    <div class="footer">© كراستي — جميع الحقوق محفوظة</div>
  </main>
</body>
</html>
